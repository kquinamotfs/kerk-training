name: API Regression

on:
  push:
    branches: [main, day-08-scheduled-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright-api-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright API regression
        run: npx playwright test tests/day03-login-redeem.spec.ts